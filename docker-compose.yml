services:
  taidy:
    build: .
    ports:
      # Host 80 (HTTP por defecto, sin puerto en la URL) -> 8000 dentro del
      # contenedor (uvicorn sigue escuchando ahí, sin cambios en el Dockerfile).
      - "80:8000"
    env_file:
      - .env
    environment:
      # false until this sits behind a TLS-terminating reverse proxy on the
      # internal network -- see ARCHITECTURE.md / api/.env.example.
      TAIDY_API_SECURE_COOKIES: "false"
    volumes:
      # Deployment-specific config -- hand-curated per environment, not baked
      # into the image. The ":z" suffix relabels the host path for shared
      # container access under SELinux (Enforcing, e.g. RHEL/Rocky) -- a
      # no-op everywhere else (Windows/macOS Docker Desktop, non-SELinux
      # Linux), so it's safe to always set.
      - ./config.json:/app/config.json:ro,z
      # Bind-mounted (not read-only) so the admin "Claves de servicio" screen
      # (webapp/env_secrets.py, which writes to /app/.env in place) edits
      # this SAME file `env_file:` above reads from -- without this mount, a
      # secret saved from that screen only ever lands in the container's
      # writable layer and silently vanishes on the next `docker compose up
      # --build` (a fresh container never sees the previous one's layer).
      - ./.env:/app/.env:z
      # tables.yaml is shared by every BC environment -- each table's `url`
      # carries a literal `{ENVIRONMENT}` placeholder resolved at load time
      # from BC_ENVIRONMENT (see .env.example), never a per-environment file.
      - ./tables.yaml:/app/tables.yaml:z
      - ./factorial_tables.yaml:/app/factorial_tables.yaml:z
      - ./hubspot_tables.yaml:/app/hubspot_tables.yaml:z
      # Persisted app state (users, schedules, workflows, history, audit) --
      # survives container recreation. See webapp/state_dir.py.
      - taidy_data:/app/data
      # Exported CSVs and Factorial's local checkpoints.
      - ./exports:/app/exports:z
      - ./exports_factorial:/app/exports_factorial:z
      - ./exports_hubspot:/app/exports_hubspot:z
    restart: unless-stopped

volumes:
  taidy_data:
